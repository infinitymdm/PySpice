<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220" style="background:#1e1e2e; border-radius:12px; font-family:system-ui, sans-serif;">
  <!-- Gradients -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="eofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="30" y="35" fill="#cdd6f4" font-size="16" font-weight="bold">Overall File Structure</text>

  <!-- Blocks Chaining -->
  <g transform="translate(30, 60)">
    <!-- Header Block -->
    <rect x="0" y="20" width="180" height="70" rx="8" fill="url(#headerGrad)"/>
    <text x="90" y="55" fill="#11111b" font-size="14" font-weight="bold" text-anchor="middle">Header Block</text>
    <text x="90" y="75" fill="#313244" font-size="11" text-anchor="middle">Metadata (UTF-8 Text)</text>

    <!-- Arrow 1 -->
    <path d="M190,55 L220,55" stroke="#a6adc8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <polygon points="220,55 210,50 210,60" fill="#a6adc8"/>

    <!-- Data Block 1 -->
    <rect x="230" y="20" width="160" height="70" rx="8" fill="url(#dataGrad)"/>
    <text x="310" y="55" fill="#11111b" font-size="14" font-weight="bold" text-anchor="middle">Data Block 1</text>
    <text x="310" y="75" fill="#313244" font-size="11" text-anchor="middle">Time Points 1 - 7</text>

    <!-- Arrow 2 -->
    <path d="M400,55 L430,55" stroke="#a6adc8" stroke-width="3" fill="none"/>
    <polygon points="430,55 420,50 420,60" fill="#a6adc8"/>

    <!-- Data Block 2 -->
    <rect x="440" y="20" width="160" height="70" rx="8" fill="url(#dataGrad)"/>
    <text x="520" y="55" fill="#11111b" font-size="14" font-weight="bold" text-anchor="middle">Data Block 2</text>
    <text x="520" y="75" fill="#313244" font-size="11" text-anchor="middle">Time Points 8 - 14</text>

    <!-- Arrow 3 -->
    <path d="M610,55 L640,55" stroke="#a6adc8" stroke-width="3" stroke-dasharray="4" fill="none"/>
    <polygon points="640,55 630,50 630,60" fill="#a6adc8"/>

    <!-- Data Block N (EOF) -->
    <rect x="650" y="20" width="90" height="70" rx="8" fill="url(#eofGrad)"/>
    <text x="695" y="55" fill="#11111b" font-size="14" font-weight="bold" text-anchor="middle">Block N</text>
    <text x="695" y="75" fill="#313244" font-size="11" text-anchor="middle">EOF (End)</text>
  </g>
</svg>
